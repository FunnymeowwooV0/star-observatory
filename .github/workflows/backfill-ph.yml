name: backfill-ph

# 一次性/維護用:回補 Product Hunt 歷史(需 repo secret PH_TOKEN,只能在這裡跑)。
# 兼任 Reddit 雲端可達性探測(僅印結果,不落地)。只能手動觸發。

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: trend-update       # 與 daily/weekly 共用,避免同時 push 撞車
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - name: PH 歷史回補(冪等)
        env:
          PH_TOKEN: ${{ secrets.PH_TOKEN }}
        run: python scripts/backfill_history.py --ph-only
      - name: Reddit 雲端可達性探測(僅印結果)
        continue-on-error: true
        run: |
          if python scripts/reddit_weekly.py > /tmp/reddit_probe.md 2>/tmp/reddit_probe.err; then
            echo "REDDIT_PROBE=OK"
            head -4 /tmp/reddit_probe.md
          else
            echo "REDDIT_PROBE=BLOCKED_OR_FAILED"
            cat /tmp/reddit_probe.err
          fi
      - name: 提交回補資料
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ph_daily.csv
          if git diff --cached --quiet; then
            echo "沒有變更,略過提交"
          else
            git commit -m "chore: 回補 Product Hunt 歷史(事後票數快照)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi
