name: daily-trend

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 01:00 UTC = 台北 09:00
  workflow_dispatch:        # 允許手動觸發

permissions:
  contents: write
  issues: write

concurrency:
  group: trend-update       # 與每週榜共用,避免同時 push 撞車
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 抓榜並產檔
        run: python scripts/fetch_trends.py --mode daily
      - name: 提交資料庫
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs archive data
          if git diff --cached --quiet; then
            echo "沒有變更,略過提交"
          else
            git commit -m "chore: 每日趨勢 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          fi
      - name: 開 Issue(= email 摘要)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '\n\ncc @FunnymeowwooV0\n' >> .issue_body.md
          gh issue create \
            --title "📈 每日趨勢 $(TZ=Asia/Taipei date +%Y-%m-%d)" \
            --body-file .issue_body.md
