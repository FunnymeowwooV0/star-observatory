name: weekly-trend

on:
  schedule:
    - cron: "0 1 * * 1"   # 每週一 01:00 UTC = 台北週一 09:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: trend-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 抓本週榜並產檔
        run: python scripts/fetch_trends.py --mode weekly
      - name: 提交資料庫
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly data
          if git diff --cached --quiet; then
            echo "沒有變更,略過提交"
          else
            git commit -m "chore: 每週趨勢 $(TZ=Asia/Taipei date +%Y-W%V)"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          fi
      - name: 開 Issue(= email 摘要)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '\n\ncc @FunnymeowwooV0\n' >> .issue_body.md
          gh issue create \
            --title "📅 每週趨勢 $(TZ=Asia/Taipei date +%Y-W%V)" \
            --body-file .issue_body.md
